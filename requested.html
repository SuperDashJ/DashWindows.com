<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Requested | Berkeley Student Windows</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="confirmation-body">
    <main class="confirmation-main">
      <section class="confirmation-panel" aria-labelledby="confirmation-title">
        <p class="section-kicker">Request sent</p>
        <h1 id="confirmation-title">Your time has been requested.</h1>
        <p class="confirmation-copy">Expect a human email and text confirmation soon.</p>

        <div class="confirmation-details" aria-label="Requested details">
          <h2>Request details</h2>
          <dl id="confirmationDetails"></dl>
        </div>

        <a class="button primary confirmation-button" href="/">Back to site</a>
      </section>
    </main>

    <script src="/requested.js"></script>
  </body>
</html>
